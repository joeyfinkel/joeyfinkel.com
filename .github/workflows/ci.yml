name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build, types, and deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Generate Worker types
        run: pnpm cf-typegen

      - name: Test resume publishing in the Workers runtime
        run: pnpm test

      - name: Build production assets and generate routes
        run: pnpm build

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Verify generated routes are committed
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Validate Cloudflare deployment packaging
        run: pnpm deploy:check
