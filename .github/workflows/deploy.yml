name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://joeyfinkel.com
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Generate Worker types
        run: pnpm cf-typegen

      - name: Test resume publishing
        run: pnpm test

      - name: Build production assets
        run: pnpm build

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Validate deployment packaging
        run: pnpm deploy:check

      - name: Deploy the verified build
        run: |
          secretsFile="$RUNNER_TEMP/joeyfinkel-worker-secrets.json"
          trap 'rm -f "$secretsFile"' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const password = process.env.PUBLISH_PASSWORD;

          if (!password || password.length < 32) {
            throw new Error('Configure PUBLISH_PASSWORD with at least 32 characters in the production environment.');
          }

          writeFileSync(
            join(process.env.RUNNER_TEMP, 'joeyfinkel-worker-secrets.json'),
            JSON.stringify({ PUBLISH_PASSWORD: password }),
            { mode: 0o600 },
          );
          NODE
          pnpm exec wrangler deploy --secrets-file "$secretsFile"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLISH_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
